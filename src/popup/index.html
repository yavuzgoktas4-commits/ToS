<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ToS Guard Popup</title>
  <link rel="stylesheet" href="../sidepanel/sidepanel.css" />
  <style>
    body {
      width: 380px;
      max-height: 580px;
      overflow-y: auto;
    }
  </style>
</head>
<body>
  <!-- Sabit Yasal Uyarı -->
  <div class="legal-disclaimer-banner">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
    </svg>
    <span>Bu uygulama hukuki tavsiye vermez. Yalnızca bilgilendirme amaçlıdır.</span>
  </div>

  <header class="app-header">
    <div class="brand-wrapper">
      <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2.2">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        <path d="m9 12 2 2 4-4"/>
      </svg>
      <span class="brand-title">ToS Guard AI</span>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="openSidePanelBtn" title="Yan Panelde Aç">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
          <line x1="15" y1="3" x2="15" y2="21"/>
        </svg>
      </button>
      <button class="icon-btn" id="openSettingsBtn" title="Ayarlar">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>
    </div>
  </header>

  <main class="main-container">
    <div class="action-card">
      <div class="page-info">
        <div class="page-title" id="pageTitle">Sayfa taranıyor...</div>
        <div class="page-meta" id="pageMeta">DOM bekleniyor</div>
      </div>
      <button class="primary-btn" id="analyzeBtn">
        <span id="btnIcon">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <polygon points="5 3 19 12 5 21 5 3"/>
          </svg>
        </span>
        <span id="btnText">Bu Sayfayı Analiz Et</span>
      </button>
      <div id="statusMessage" class="page-meta" style="color: #38bdf8;"></div>
    </div>

    <div class="injection-alert hidden" id="injectionAlert">
      <div class="injection-title">PROMPT INJECTION TESPİT EDİLDİ</div>
      <div style="font-size: 11px;">Metindeki manipülatif komutlar etkisiz kılındı.</div>
    </div>

    <div id="resultsSection" class="hidden" style="display: flex; flex-direction: column; gap: 14px;">
      <div class="score-overview-card">
        <div class="score-header">
          <span style="font-size: 12px; font-weight: 700; color: var(--text-secondary);">RİSK SKORU</span>
          <div class="score-badge score-high" id="scoreBadge">0 / 100</div>
        </div>
        <div class="summary-text" id="summaryTr"></div>
        <div class="gatekeeper-badge" id="gatekeeperBadge">
          <span id="gatekeeperStats">Sıfır Halüsinasyon Doğrulandı</span>
        </div>
      </div>

      <div>
        <div class="section-heading" style="margin-bottom: 8px;">
          <span>Risk Maddeleri (<span id="riskCount">0</span>)</span>
        </div>
        <div class="risks-container" id="risksList"></div>
      </div>

      <div class="uncertainties-box" id="uncertaintiesBox">
        <div class="section-heading" style="margin-bottom: 8px;">
          <span>Belirsizlikler &amp; Gri Alanlar</span>
        </div>
        <ul id="uncertaintiesList"></ul>
      </div>
    </div>
  </main>

  <script type="module" src="popup.ts"></script>
</body>
</html>
